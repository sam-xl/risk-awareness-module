# Package manifest for Pixi: builds this ROS 2 package as a conda package.
# Name, version and dependencies come from package.xml. See the CoreSense
# guide: https://coresenseeu.github.io/tutorials/docs/pixi_release.html
[package]
publish = true

[package.build.backend]
name = "pixi-build-ros"
workspace = true

[package.build.config]
# The backend's default input globs cover config/*.yaml and launch/**/*.py;
# our parameter file is .yml.
extra-input-globs = ["config/*.yml"]
