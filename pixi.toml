# Workspace manifest for Pixi: builds and publishes the four RiskAM ROS 2
# packages for the CoreSense Pixi channel (ROS 2 Jazzy). For Kilted, replace
# "jazzy" with "kilted" throughout this file. See the CoreSense guide:
# https://coresenseeu.github.io/tutorials/docs/pixi_release.html
#
#   pixi install                             # builds the packages into .pixi/
#   pixi run start                           # launches the node, nothing to source
#   pixi publish --target-channel ./output   # conda packages into ./output
[workspace]
name = "risk-awareness-module"
channels = ["https://prefix.dev/coresense-jazzy",
            "https://prefix.dev/robostack-jazzy",
            "conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[workspace.dependencies]
pixi-build-ros = ">=0.7.5"

[dependencies]
ros-jazzy-riskam = { path = "riskam" }
ros-jazzy-riskam-msgs = { path = "riskam_msgs" }
ros-jazzy-riskam-ros = { path = "riskam_ros" }
ros-jazzy-riskam-bringup = { path = "riskam_bringup" }
ros-jazzy-ros2run = "*"
ros-jazzy-ros2topic = "*"   # `pixi run ros2 topic echo /riskam/risk_score`

[tasks]
start = "ros2 launch riskam_bringup riskam.launch.py"
