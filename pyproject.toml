[project]
name = "risk-awareness-module"
version = "0.0.1"
description = "CoreSense Risk Awareness Module — research and evaluation toolchain."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "joblib",
    "lap>=0.5.12",
    "matplotlib",
    "numpy<2.0.0",
    "opencv-contrib-python-headless",
    "opencv-python",
    "pillow",
    "PyYAML",
    "seaborn",
    "scikit-learn",
    "torch==2.8.0; platform_machine == 'aarch64'",
    "torch; platform_machine != 'aarch64'",
    "torchvision==0.23.0; platform_machine == 'aarch64'",
    "torchvision; platform_machine != 'aarch64'",
    "tqdm",
    "ultralytics",
    "rosbags>=0.11.3",
]

[dependency-groups]
dev = [
    "pytest",
]
experiments = [
    "statsmodels>=0.14.6",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "jetson-ai-lab-jp6-cu129"
url = "https://pypi.jetson-ai-lab.io/jp6/cu129"
explicit = true

[tool.uv.sources]
torch = [
    { index = "jetson-ai-lab-jp6-cu129", marker = "platform_machine == 'aarch64'" },
]
torchvision = [
    { index = "jetson-ai-lab-jp6-cu129", marker = "platform_machine == 'aarch64'" },
]

[tool.pytest.ini_options]
pythonpath = ["riskam"]  # the riskam ROS package dir holds the importable package
