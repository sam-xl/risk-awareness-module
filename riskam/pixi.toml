# Package manifest for Pixi: builds this ROS 2 package as a conda package.
# Name, version and dependencies come from package.xml. See the CoreSense
# guide: https://coresenseeu.github.io/tutorials/docs/pixi_release.html
[package]
publish = true

[package.build.backend]
name = "pixi-build-ros"
workspace = true

# rosdep keys from package.xml that the backend's built-in RoboStack mapping
# does not know, mapped to their conda-forge names.
[[package.build.config.extra-package-mappings]]
python3-torchvision-pip = { conda = ["torchvision"] }
python3-ultralytics-pip = { conda = ["ultralytics"] }
python3-tqdm = { conda = ["tqdm"] }
python3-seaborn = { conda = ["seaborn"] }

# Runtime dependencies without a rosdep key: torch (imported directly by the
# library) and lap (ByteTrack's linear-assignment solver, which ultralytics
# would otherwise try to pip-install on first use, impossible in a conda
# environment).
[package.run-dependencies]
pytorch = "*"
lap = "*"
